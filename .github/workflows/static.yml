# Deploy DUAL PERSONA (folder /site) ke GitHub Pages
name: Deploy static content to Pages

on:
  # Deploy setiap push ke branch utama dan branch kerja Arena
  push:
    branches: ["main", "arena/511e44d5-datalab"]

  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

# Izin GITHUB_TOKEN untuk deploy ke Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu deployment berjalan pada satu waktu
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Situs Pages harus ada sebelum artefak bisa di-deploy. Kalau belum pernah
      # diaktifkan, langkah ini mencoba membuatnya sendiri memakai PAGES_TOKEN
      # (secret opsional, butuh izin "Pages: write"); GITHUB_TOKEN biasa tidak
      # diizinkan membuat situs, jadi kegagalannya hanya jadi peringatan.
      - name: Pastikan GitHub Pages aktif
        id: pages_status
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          token="${PAGES_TOKEN:-$GH_TOKEN}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"

          status() {
            curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@" || echo "000"
          }

          code=$(status "$api")
          echo "Status Pages saat ini: HTTP ${code}"

          if [ "${code}" != "200" ] && [ -n "${PAGES_TOKEN:-}" ]; then
            echo "Mencoba mengaktifkan Pages dengan PAGES_TOKEN…"
            created=$(status -X POST "$api" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}')
            echo "Buat situs Pages: HTTP ${created}"
            code=$(status "$api")
          fi

          if [ "${code}" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        id: pages
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          # Hanya folder game (situs statis tanpa build step)
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5

      - name: Pages belum aktif — butuh satu kali pengaturan
        if: steps.pages_status.outputs.enabled != 'true'
        run: |
          echo "::warning title=GitHub Pages belum aktif::Buka Settings → Pages → Source: GitHub Actions (sekali saja). Setelah itu setiap push otomatis men-deploy folder site/."
          {
            echo "### GitHub Pages belum diaktifkan untuk repo ini"
            echo
            echo "Workflow **tidak gagal** karena ini masalah konfigurasi repo, bukan kode:"
            echo "situs Pages belum pernah dibuat, dan token Actions tidak berwenang membuatnya."
            echo
            echo "**Aktifkan sekali (30 detik):**"
            echo "1. Buka \`Settings → Pages\` di repo ini."
            echo "2. Pada *Build and deployment → Source*, pilih **GitHub Actions**."
            echo "3. Jalankan ulang workflow ini (atau push commit baru)."
            echo
            echo "Setelah aktif, setiap push ke \`main\` / branch ini otomatis men-deploy folder \`site/\`."
            echo
            echo "Ingin sepenuhnya otomatis? Tambahkan secret \`PAGES_TOKEN\`"
            echo "(fine-grained PAT dengan izin **Pages: Read and write**) dan workflow ini"
            echo "akan mengaktifkan Pages sendiri tanpa langkah manual."
          } >> "$GITHUB_STEP_SUMMARY"
