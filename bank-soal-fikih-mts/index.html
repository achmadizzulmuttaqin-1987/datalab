<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bank Soal Fikih MTs — Kelas 7, 8, 9 (HOTS)</title>
<meta name="description" content="Bank soal Fikih MTs kelas 7, 8, dan 9. Soal pilihan ganda HOTS per materi, lengkap dengan kunci jawaban dan pembahasan.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📗</text></svg>">
<style>
:root{
  --green:#0f6b4f; --green-d:#0a4d39; --green-l:#e6f4ef;
  --gold:#c9962b; --gold-l:#fdf6e6;
  --ink:#12211c; --ink-2:#3f5a51; --muted:#71877f;
  --bg:#f4f7f5; --card:#ffffff; --line:#e2e9e5;
  --ok:#1a8f5a; --ok-l:#e7f6ee; --bad:#c0392b; --bad-l:#fdeceb;
  --blue:#1c6ea4; --blue-l:#e8f2f9;
  --r:14px; --rs:10px;
  --shadow:0 1px 2px rgba(16,40,32,.06),0 6px 20px -8px rgba(16,40,32,.18);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --arab:"Scheherazade New","Traditional Arabic","Amiri","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.6;
  background-image:radial-gradient(circle at 12% -5%,rgba(15,107,79,.10),transparent 42%),radial-gradient(circle at 92% 0%,rgba(201,150,43,.10),transparent 38%);
  background-attachment:fixed;min-height:100vh}
a{color:var(--green)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 64px}
.arab{font-family:var(--arab);font-size:1.35em;line-height:2;direction:rtl;unicode-bidi:isolate}

/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,var(--green-d),var(--green) 55%,#13805e);
  color:#fff;box-shadow:0 2px 14px rgba(10,60,44,.28)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;cursor:pointer;background:none;border:0;color:#fff;padding:0;text-align:left}
.brand .logo{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:20px;border:1px solid rgba(255,255,255,.25)}
.brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11.5px;opacity:.82;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.tbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{background:rgba(255,255,255,.24)}
.backbtn{display:none}
body.in-quiz .backbtn{display:inline-flex}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:12px;margin:16px 0;overflow-x:auto;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap;font-size:14px}
.tabs button.on{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(15,107,79,.28)}

/* ---------- Cards / hero ---------- */
.hero{background:linear-gradient(120deg,#fff, #fbfefa);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-40px;top:-40px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(201,150,43,.16),transparent 70%)}
.hero h2{margin:0 0 6px;font-size:21px}
.hero p{margin:0;color:var(--ink-2);max-width:70ch}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-top:16px}
.stat{background:var(--green-l);border:1px solid #d3e8df;border-radius:var(--rs);padding:11px 13px}
.stat b{display:block;font-size:21px;color:var(--green-d);line-height:1.15}
.stat span{font-size:11.8px;color:var(--ink-2);font-weight:600;letter-spacing:.2px;text-transform:uppercase}

.gradebar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-weight:600;font-size:13.5px;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip .n{font-size:11px;background:rgba(0,0,0,.07);border-radius:999px;padding:1px 7px;font-weight:700}
.chip.on .n{background:rgba(255,255,255,.24)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(315px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;position:relative;transition:.16s;overflow:hidden}
.card:hover{transform:translateY(-2px);border-color:#c9ded4;box-shadow:0 4px 8px rgba(16,40,32,.07),0 14px 30px -12px rgba(16,40,32,.24)}
.card .sem{position:absolute;top:0;right:0;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-bottom-left-radius:10px;background:var(--gold-l);color:#8a6516;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.card h3{margin:0;font-size:16px;line-height:1.35;padding-right:74px}
.card .desc{color:var(--muted);font-size:13px;margin:0;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--green-l);color:var(--green-d);border:1px solid #d3e8df}
.tag.g{background:var(--gold-l);color:#8a6516;border-color:#f0e2c0}
.tag.b{background:var(--blue-l);color:#155a86;border-color:#d4e5f1}
.prog{height:6px;background:#eef2f0;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#25a06f);border-radius:99px;width:0}
.card .row{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:9px;padding:9px 14px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;justify-content:center;text-decoration:none}
.btn:hover{background:var(--green-d);border-color:var(--green-d)}
.btn.ghost{background:#fff;color:var(--green-d);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--green);background:var(--green-l)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3a2a05}
.btn.gold:hover{background:#b5851f;border-color:#b5851f}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:7px 11px;font-size:12.5px}
.btn.big{padding:13px 22px;font-size:15px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grow{flex:1}

/* ---------- Setup sheet ---------- */
.sheet{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.field{margin-bottom:16px}
.field>label{display:block;font-weight:700;font-size:13px;margin-bottom:7px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.opt.on{border-color:var(--green);background:var(--green-l);color:var(--green-d);box-shadow:inset 0 0 0 1px var(--green)}
.hint{font-size:12.5px;color:var(--muted);margin-top:7px}

/* ---------- Quiz ---------- */
.qbar{position:sticky;top:62px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;box-shadow:var(--shadow);margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qbar .ttl{font-weight:700;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.qbar .pill{font-size:12px;font-weight:700;background:var(--green-l);color:var(--green-d);border-radius:999px;padding:4px 11px;border:1px solid #d3e8df;white-space:nowrap}
.qbar .pill.time{background:var(--gold-l);color:#8a6516;border-color:#f0e2c0;font-variant-numeric:tabular-nums}
.qbar .pill.time.warn{background:var(--bad-l);color:var(--bad);border-color:#f2cfcb}
.qtrack{width:100%;height:5px;background:#eef2f0;border-radius:99px;overflow:hidden}
.qtrack i{display:block;height:100%;background:var(--green);width:0;transition:.25s}

.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qhead{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.qnum{font-size:12px;font-weight:800;color:#fff;background:var(--green);border-radius:7px;padding:4px 10px;letter-spacing:.4px}
.badge{font-size:10.8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3.5px 9px;border-radius:6px}
.badge.hots{background:#fdeeea;color:#a8442a;border:1px solid #f6d5ca}
.badge.lots{background:#eef1f6;color:#4b5b70;border:1px solid #dde3ec}
.badge.mots{background:var(--gold-l);color:#8a6516;border:1px solid #f0e2c0}
.badge.ind{background:var(--blue-l);color:#155a86;border:1px solid #d4e5f1;margin-left:auto}
.qtext{font-size:15.6px;margin:0 0 14px;white-space:pre-line}
.qstim{background:#fbfcfb;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:9px;padding:12px 14px;margin-bottom:13px;white-space:pre-line;font-size:14.6px}
.qstim .arab{display:block;text-align:right;margin-bottom:6px}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{display:flex;gap:11px;align-items:flex-start;border:1.6px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;text-align:left;width:100%;transition:.13s;color:var(--ink)}
.ans:hover{border-color:#a9cbc0;background:#fafdfc}
.ans .k{flex:0 0 27px;height:27px;border-radius:8px;background:#eef2f0;color:var(--ink-2);display:grid;place-items:center;font-weight:800;font-size:13px;border:1px solid var(--line)}
.ans .t{flex:1;padding-top:2px}
.ans.on{border-color:var(--green);background:var(--green-l);box-shadow:inset 0 0 0 1px var(--green)}
.ans.on .k{background:var(--green);color:#fff;border-color:var(--green)}
.ans.correct{border-color:var(--ok);background:var(--ok-l);box-shadow:inset 0 0 0 1px var(--ok)}
.ans.correct .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.ans.wrong{border-color:var(--bad);background:var(--bad-l);box-shadow:inset 0 0 0 1px var(--bad)}
.ans.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.ans:disabled{cursor:default}
.fb{margin-top:14px;border-radius:11px;padding:13px 15px;font-size:14.2px;border:1px solid}
.fb.ok{background:var(--ok-l);border-color:#bfe4cf}
.fb.no{background:var(--bad-l);border-color:#f2cfcb}
.fb b{display:block;margin-bottom:3px}
.qnav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.palette{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-top:14px}
.palette h4{margin:0 0 9px;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pcell{aspect-ratio:1/1;border-radius:8px;border:1.4px solid var(--line);background:#fff;font-weight:700;font-size:12.5px;color:var(--ink-2);display:grid;place-items:center;position:relative}
.pcell.ans-d{background:var(--green-l);border-color:#bfe0d3;color:var(--green-d)}
.pcell.cur{outline:2.5px solid var(--gold);outline-offset:1px}
.pcell.flag:after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.pcell.right{background:var(--ok-l);border-color:#bfe4cf;color:var(--ok)}
.pcell.wr{background:var(--bad-l);border-color:#f2cfcb;color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:11px;font-size:11.8px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

/* ---------- Result ---------- */
.score-hero{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px;text-align:center}
.ring{--p:0;width:150px;height:150px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--rc,#1a8f5a) calc(var(--p)*1%),#eef2f0 0)}
.ring .in{width:118px;height:118px;background:#fff;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 1px 5px rgba(0,0,0,.07)}
.ring b{font-size:34px;line-height:1}
.ring span{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:18px}
.res-cell{border:1px solid var(--line);border-radius:var(--rs);padding:11px}
.res-cell b{display:block;font-size:20px;line-height:1.2}
.res-cell span{font-size:11.6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.res-cell.ok b{color:var(--ok)} .res-cell.bad b{color:var(--bad)} .res-cell.mut b{color:var(--muted)}
.verdict{margin-top:12px;font-size:15px;color:var(--ink-2)}
.verdict b{font-size:17px}

.review{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.ritem{background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:14px;box-shadow:0 1px 2px rgba(16,40,32,.05)}
.ritem.ok{border-left:4px solid var(--ok)}
.ritem.no{border-left:4px solid var(--bad)}
.ritem.sk{border-left:4px solid var(--muted)}
.ritem .rh{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.ritem .ans-line{font-size:13.2px;margin:5px 0}
.ritem .ans-line b{font-weight:800}
.exp{background:#fbfcfb;border:1px dashed var(--line);border-radius:9px;padding:11px 13px;font-size:13.8px;margin-top:9px;color:var(--ink-2);white-space:pre-line}

/* ---------- Browse mode ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:190px;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-family:inherit;font-size:14px;background:#fff}
.search:focus{outline:2px solid var(--green-l);border-color:var(--green)}

/* ---------- History / stats ---------- */
table.hist{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);font-size:13.6px}
table.hist th,table.hist td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
table.hist th{background:var(--green-l);color:var(--green-d);font-size:11.6px;text-transform:uppercase;letter-spacing:.4px}
table.hist tr:last-child td{border-bottom:0}
.pillsm{font-size:11.4px;font-weight:800;padding:2.5px 8px;border-radius:6px}
.pillsm.ok{background:var(--ok-l);color:var(--ok)} .pillsm.no{background:var(--bad-l);color:var(--bad)}

.empty{text-align:center;padding:44px 20px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;font-size:16px;color:var(--ink-2);margin-bottom:5px}

/* ---------- Modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(9,26,20,.5);display:none;place-items:center;z-index:100;padding:16px;backdrop-filter:blur(2px)}
.modal.on{display:grid}
.mbox{background:#fff;border-radius:var(--r);max-width:430px;width:100%;padding:22px;box-shadow:0 24px 60px -12px rgba(0,0,0,.4);animation:fade .18s}
.mbox h3{margin:0 0 8px;font-size:17px}
.mbox p{margin:0 0 18px;color:var(--ink-2);font-size:14.2px}
.mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#12211c;color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
footer.foot{max-width:1120px;margin:0 auto;padding:22px 16px 40px;color:var(--muted);font-size:12.6px;text-align:center}

@media(max-width:640px){
  body{font-size:15px}
  .top-in{padding:10px 12px}
  .brand h1{font-size:13.5px} .brand small{font-size:10.6px}
  .wrap{padding:0 12px 48px}
  .qbar{top:58px;padding:9px 11px;gap:8px}
  .qcard{padding:15px}
  .grid{grid-template-columns:1fr}
  .hero{padding:16px}
  .hero h2{font-size:18px}
  .ring{width:130px;height:130px}.ring .in{width:102px;height:102px}.ring b{font-size:29px}
  .tbtn span.lbl{display:none}
}
@media print{
  header.top,.tabs,.qnav,.palette,.qbar,.btn,.top-actions{display:none!important}
  body{background:#fff}
  .qcard,.ritem{box-shadow:none;break-inside:avoid;border-color:#ccc}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <button class="tbtn backbtn" id="btnBack" title="Keluar dari latihan">← <span class="lbl">Keluar</span></button>
    <button class="brand" id="btnHome">
      <div class="logo">📗</div>
      <div>
        <h1>Bank Soal Fikih MTs</h1>
        <small id="brandSub">Kelas 7 · 8 · 9 — Soal Pilihan Ganda HOTS</small>
      </div>
    </button>
    <div class="top-actions">
      <button class="tbtn" id="btnStats" title="Statistik & riwayat">📊 <span class="lbl">Progres</span></button>
      <button class="tbtn" id="btnAbout" title="Tentang">ℹ️</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="view"></div>
</div>

<footer class="foot" id="foot"></footer>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
window.__BS = window.__BS || {topics:{}, index:[]};
window.BSRegister = function(o){ window.__BS.topics[o.id] = o; };
</script>
<script src="data/index.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var idx = (window.__BS && window.__BS.index) || [];
  var loaded = 0, failed = 0;
  if(!idx.length){ App.bootError('Indeks materi tidak ditemukan.'); return; }
  idx.forEach(function(m){
    var s = document.createElement('script');
    s.src = m.file;
    s.onload  = function(){ loaded++; check(); };
    s.onerror = function(){ failed++; check(); };
    document.body.appendChild(s);
  });
  function check(){ if(loaded + failed === idx.length) App.start(failed ? idx.filter(function(m){return !window.__BS.topics[m.id];}).map(function(m){return m.title;}) : null); }
})();
</script>
</body>
</html>
